name: Edge proof (container limits)

on:
  push:
    paths: ["docker/**", "eval/edge_bench.py", "profiles/**", ".github/workflows/edge.yml"]
  workflow_dispatch:

jobs:
  edge:
    name: ${{ matrix.profile }} - ${{ matrix.cpus }} CPU / ${{ matrix.mem }} RAM / no network (ARM64)
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - {profile: lite, cpus: "2", mem: 2g, cpuset: "0,1"}
          - {profile: plus, cpus: "4", mem: 4g, cpuset: "0-3"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements.txt
      - uses: docker/setup-buildx-action@v3
      - name: Build image (llama.cpp compiled inside)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: vehiclegpt:edge
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image size
        run: docker image ls vehiclegpt:edge --format '{{.Repository}}:{{.Tag}} {{.Size}}'
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: models
          key: models-${{ matrix.profile }}-v1
      - name: Download model (outside the box - the only internet use)
        run: python scripts/get_model.py --profile ${{ matrix.profile }}
      - name: Generate the vehicle's recordings (the car, not VehicleGPT)
        run: python -m twin.generate | tail -3
      - name: Install cyclictest (real-time latency tool)
        if: matrix.profile == 'lite'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rt-tests
      - name: Safety-domain timing BASELINE (CPU 3, VehicleGPT not running)
        if: matrix.profile == 'lite'
        run: sudo cyclictest -a 3 -p 80 -m -i 1000 -l 20000 -q | tee jitter_idle.txt
      - name: Run VehicleGPT in the box
        run: |
          mkdir -p data && chmod -R a+rwX data models
          docker run -d --name vg --cpus=${{ matrix.cpus }} --cpuset-cpus=${{ matrix.cpuset }} \
            --memory=${{ matrix.mem }} --memory-swap=${{ matrix.mem }} --network none \
            -v $PWD/models:/app/models:ro -v $PWD/data:/app/data vehiclegpt:edge \
            python -m eval.edge_bench --profile ${{ matrix.profile }}
          if [ "${{ matrix.profile }}" = "lite" ]; then
            for i in $(seq 1 600); do docker logs vg 2>&1 | grep -q "PHASE SMART" && break; sleep 1; done
            echo "SMART load running on CPUs 0-1 -> measuring safety-domain timing on CPU 3"
            sudo cyclictest -a 3 -p 80 -m -i 1000 -l 20000 -q | tee jitter_load.txt
          fi
          docker wait vg
          docker logs vg 2>&1 | tail -30
      - name: Summary
        run: |
          docker logs vg 2>&1 | grep '^RESULT ' | sed 's/^RESULT //' | python -m json.tool
          [ -f jitter_idle.txt ] && echo "jitter idle:" && cat jitter_idle.txt && echo "jitter under VehicleGPT load:" && cat jitter_load.txt || true
