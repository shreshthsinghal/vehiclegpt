someip:                          # service_id -> event_id -> struct format + fields [vss_path, scale]
  0x1100:                        # thermal-management service
    0x8001: {format: ">hHHB", fields: [[Vehicle.Private.Thermal.CoolantTemperature.Battery, 0.1], [Vehicle.Private.Thermal.CoolantPump.Speed, 1], [Vehicle.Private.Thermal.CoolantPump.Current, 0.01], [Vehicle.Private.Thermal.ChillerActive, 1]]}
  0x1200:                        # ADAS service
    0x8001: {format: ">BBBBB", fields: [[Vehicle.ADAS.CruiseControl.IsActive, 1], [Vehicle.ADAS.LaneDepartureDetection.IsEnabled, 1], [Vehicle.ADAS.LaneDepartureDetection.IsWarning, 1], [Vehicle.Private.ADAS.LaneKeepAssist.IsActive, 1], [Vehicle.Private.ADAS.LaneMarkingConfidence, 1]]}
    0x8002: {format: ">BHB", event: ADAS_EVENT}
  0x1300:                        # camera service (metadata only - no images)
    0x8001: {format: ">BBB", fields: [[Vehicle.Private.Camera.Front.Status, 1], [Vehicle.Private.Camera.Front.ObjectCount, 1], [Vehicle.Private.Camera.Front.Visibility, 1]]}
adas_reasons: {1: LANE_MARKINGS_LOST, 2: CAMERA_UNAVAILABLE, 3: DRIVER_OVERRIDE, 4: ODD_EXIT}
camera_status: {0: OK, 1: DEGRADED, 2: BLOCKED, 3: OFFLINE}

vhal:                            # property id -> vss path, scale; CAN wins if both report the same path
  "0x11600207": [Vehicle.Speed, 3.6]                       # PERF_VEHICLE_SPEED m/s -> km/h
  "0x11600703": [Vehicle.Exterior.AirTemperature, 1]       # ENV_OUTSIDE_TEMPERATURE
  "0x1520050A": [Vehicle.Cabin.HVAC.IsAirConditioningActive, 1]
  "0x15600503": [Vehicle.Cabin.HVAC.Station.Row1.Driver.Temperature, 1]
  "0x11400400": [Vehicle.Powertrain.Transmission.SelectedGear, 1]
  "0x21600F01": [Vehicle.CurrentLocation.Latitude, 1]      # vendor; coarsened to 0.01 deg (~1 km) for privacy
  "0x21600F02": [Vehicle.CurrentLocation.Longitude, 1]
  "0x21400F03": [Vehicle.Private.Road.Type, 1]              # 0 city, 1 highway

privacy:
  coarsen_degrees: 0.01
