# Emergency guide: fixed, reviewed steps (NEVER generated by the language model).
# Written in our own words from the cited sources. Generic EV guidance: the car's owner's manual always takes precedence.
# VehicleGPT never acts on the car: these are instructions for the driver, shown in large type and read aloud.
numbers: {all: 112, ambulance: 108, fire: 101}

topics:
  brake_failure:
    title: "Brakes not working"
    steps:
      - "Stay calm. Switch on the hazard lights and use the horn to warn others."
      - "Lift your foot off the accelerator: in an electric car, regenerative braking starts slowing you down at once."
      - "Press the brake pedal hard. If it sinks to the floor, pump it quickly to build pressure."
      - "Emergency braking: pull up and HOLD the electronic parking-brake switch. The car brakes only while you hold it."
      - "Steer towards a safe, clear area away from traffic. Do not switch the car off while moving: you can lose steering assist."
      - "Once stopped, keep the hazards on, move to safety and call for help. Do not drive the car again until it is inspected."
    sources:
      - "https://driversed.com/driving-information/defensive-driving/brake-failure/"
      - "https://ownersmanual.kia.com/full_webhelp/NQ5/2024/en_US/topics/t00325.html"
    context: [speed, gear, abs, esc, brake_pedal]

  stuck_accelerator:
    title: "Car keeps accelerating"
    steps:
      - "Press the brake firmly and steadily. Do not pump it."
      - "Shift to Neutral (N). This disconnects the motor from the wheels."
      - "Steer to a safe place and come to a complete stop."
      - "Only after the car has stopped, switch it off and put it in Park."
      - "Do not drive it again; have it checked."
    sources:
      - "https://www.transportation.gov/testimony/response-toyota-and-nhtsa-incidents-sudden-unintended-acceleration"
    context: [speed, gear, accel_pedal]

  fire:
    title: "Smoke, fire or burning smell"
    steps:
      - "Signal and pull over as soon as it is safe, away from traffic."
      - "Stop, switch the car off and put it in Park."
      - "Get everyone out. Never go back to the car for anything."
      - "Move at least 30 metres away, upwind if you can, and away from traffic."
      - "Call 112 (fire: 101). Tell them it is an ELECTRIC car with a high-voltage battery."
    sources:
      - "https://www.nfpa.org/education-and-research/energy-transition/electric-vehicles"
      - "https://www.nhtsa.gov/sites/nhtsa.gov/files/811575-interimguidehev-hv-batt_lawenforce-ems-firedept-v2.pdf"
    context: [speed, batt_temp, coolant_pump]

  overheat:
    title: "Battery temperature warning"
    steps:
      - "Ease off: drive gently and reduce speed; switch off non-essential loads."
      - "Pull over when it is safe, put the car in Park and let the battery cool."
      - "If you see smoke, hear popping or smell burning, follow the FIRE steps: get everyone out and call 112."
      - "Do not fast-charge until the battery has cooled and the cause is checked."
      - "Book a service visit: the cooling system may need inspection."
    sources:
      - "https://www.ontariohyundai.com/ev-battery-warning-light/"
      - "https://sparrowcar.com/blog/what-does-an-ev-battery-temperature-warning-mean/"
    context: [batt_temp, coolant_pump, power_limit, speed]

  blowout:
    title: "Tyre burst"
    steps:
      - "Hold the steering wheel firmly with both hands and keep the car straight."
      - "Do not brake hard. Ease off the accelerator gradually and let the car slow down."
      - "Once the speed is low, steer gently to the side of the road."
      - "Stop completely and switch on the hazard lights."
      - "Change the tyre only if you are safely off the road; otherwise call roadside help."
    sources:
      - "https://roadside.goodsam.com/resources/what-to-do-if-you-have-a-tire-blowout"
    context: [speed, tyre_fl, tyre_fr, tyre_rl, tyre_rr]

  flood:
    title: "Flood water"
    steps:
      - "Never drive into flood water: you cannot tell how deep or fast it is. Turn around."
      - "If the car stalls in water, do not try to restart it."
      - "If water is rising, leave the car and move to higher ground."
      - "Call 112 once you are safe."
      - "After any flooding, treat the high-voltage battery as live: have the car inspected before using it."
    sources:
      - "https://www.weather.gov/safety/flood-turn-around-dont-drown"
      - "https://www.nhtsa.gov/sites/nhtsa.gov/files/811575-interimguidehev-hv-batt_lawenforce-ems-firedept-v2.pdf"
    context: [speed, power_state]

  crash:
    title: "After a crash"
    steps:
      - "Stop safely and switch on the hazard lights. Make sure you are not in danger from traffic."
      - "Call 112 (ambulance: 108). Give the exact location and the number of people hurt."
      - "Do not move injured people unless there is fire or another immediate danger."
      - "If the car is damaged, stay away from the battery area and tell responders it is an ELECTRIC car."
      - "Anyone helping in good faith is protected by India's Good Samaritan rules."
    sources:
      - "https://www.missionsaferroads.in/lessons/emergency-response"
      - "https://www.nhtsa.gov/sites/nhtsa.gov/files/811575-interimguidehev-hv-batt_lawenforce-ems-firedept-v2.pdf"
    context: [speed, power_state, batt_temp]

  power_loss:
    title: "Sudden loss of power"
    steps:
      - "Switch on the hazard lights and keep steering smoothly."
      - "Move to the side of the road while you still have speed."
      - "Stop in a safe place, put the car in Park and check the warnings on the dashboard."
      - "Ask me \"what happened before the warning?\" to see the cause, then call roadside service."
    sources:
      - "https://www.ontariohyundai.com/ev-battery-warning-light/"
    context: [power_limit, batt_temp, soc, speed]

  drowsy:
    title: "Feeling sleepy while driving"
    steps:
      - "Drowsy driving is dangerous: plan to stop now, do not push on."
      - "Take the next safe exit or rest area and park in a well-lit place."
      - "Have a caffeinated drink, then take a 15–20 minute nap; caffeine starts working after about 30 minutes."
      - "This is only a short-term fix. If you are still tired, rest longer or let someone else drive."
    sources:
      - "https://www.cdc.gov/niosh/work-hour-training-for-nurses/longhours/mod11/04.html"
      - "https://www.nhtsa.gov/speeches-presentations/national-sleep-foundation-drowsy-driving-forum"
    context: [speed, cabin_temp]
